# Anthropic Claude Sonnet target via HTTP. Requires ANTHROPIC_API_KEY in env.
#
# Note: this is a YAML reference — the run.py uses the LLM client
# abstraction directly, which is cleaner. The YAML is here so users can
# adapt the same approach to any HTTP-exposed LLM API (vLLM, TGI, etc.).
type: http
name: claude-sonnet
url: https://api.anthropic.com/v1/messages
method: POST
headers:
  content-type: application/json
  anthropic-version: "2023-06-01"
  # x-api-key: set this header when calling via CLI: --header x-api-key=$ANTHROPIC_API_KEY
payload_template: |
  {
    "model": "claude-sonnet-4-6",
    "max_tokens": 100,
    "temperature": 0.0,
    "messages": [{"role": "user", "content": {{ input.prompt | tojson }}}]
  }
response_path: content[0].text
timeout_s: 30
